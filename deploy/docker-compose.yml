version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: famtime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-famtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-famtime123}
      POSTGRES_DB: ${POSTGRES_DB:-famtime}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-famtime} -d ${POSTGRES_DB:-famtime}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - famtime-network

  # NestJS 后端服务
  server:
    build:
      context: ./src
      dockerfile: ../Dockerfile
    container_name: famtime-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-famtime}:${POSTGRES_PASSWORD:-famtime123}@postgres:5432/${POSTGRES_DB:-famtime}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      WECHAT_APPID: ${WECHAT_APPID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      WECHAT_TEMPLATE_EVENT_REMINDER: ${WECHAT_TEMPLATE_EVENT_REMINDER}
      WECHAT_TEMPLATE_FAMILY_INVITE: ${WECHAT_TEMPLATE_FAMILY_INVITE}
      WECHAT_TEMPLATE_MONTHLY_MEMORY: ${WECHAT_TEMPLATE_MONTHLY_MEMORY}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - famtime-network
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npx prisma db seed || true &&
        node dist/main
      "

volumes:
  postgres_data:
    driver: local

networks:
  famtime-network:
    driver: bridge
